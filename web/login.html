<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in - natsui</title><link rel="icon" href="/kitten.svg"><link rel="stylesheet" href="/fibril.css"><link rel="stylesheet" href="/style.css"><script src="/login.js" defer></script></head><body class="login-page"><main class="login-card panel inspector"><a class="brand" href="/"><span>natsui<span class="brand-dot">.</span></span></a><p class="eyebrow">DASHBOARD ACCESS</p><h1>Sign in</h1><p id="login-intro">Open a one-time link from <code>natsui login</code>, or enter the dashboard access key.</p><p id="oidc-login" hidden><a class="primary" href="/api/auth/oidc/start">Sign in with SSO</a></p><form id="nats-login-form" hidden><label>Cluster<select id="nats-profile" required></select></label><label>NATS username<input id="nats-username" autocomplete="username" required maxlength="256"></label><label>NATS password<input id="nats-password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" type="submit">Sign in with NATS</button><p id="nats-sharing" class="panel-note"></p></form><details id="key-login" open><summary>Dashboard access key</summary><form id="login-form"><label>Dashboard access key<input id="access-key" type="password" autocomplete="current-password" required maxlength="64" autofocus></label><button class="primary" type="submit">Sign in</button></form></details><p id="login-status" role="status" aria-live="polite"></p><p id="login-note" class="panel-note">This key grants the dashboard's configured operator access. NATS credentials are managed separately.</p></main></body></html>
