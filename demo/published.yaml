name: natsui-tryout
x-nats: &nats
  image: nats:2.11.8-alpine
  restart: unless-stopped
  mem_limit: 256m
  pids_limit: 128
  configs: [{source: nats-config, target: /etc/nats/demo.conf}]
  healthcheck:
    test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
    interval: 5s
    timeout: 3s
    retries: 24
  logging: &logging
    driver: json-file
    options: {max-size: 5m, max-file: '2'}
services:
  nats-1:
    <<: *nats
    command: [-c, /etc/nats/demo.conf, --name, demo-1]
    volumes: [node1:/data]
  nats-2:
    <<: *nats
    command: [-c, /etc/nats/demo.conf, --name, demo-2]
    volumes: [node2:/data]
  nats-3:
    <<: *nats
    command: [-c, /etc/nats/demo.conf, --name, demo-3]
    volumes: [node3:/data]
  traffic:
    image: ghcr.io/axmouth/natsui-traffic:latest
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    tmpfs: ['/tmp:size=8m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      nats-1: {condition: service_healthy}
      nats-2: {condition: service_healthy}
      nats-3: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-float(pathlib.Path('/tmp/traffic-heartbeat').read_text()) < 20"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    logging: *logging
  dashboard:
    image: ghcr.io/axmouth/natsui:latest
    restart: unless-stopped
    ports: ['127.0.0.1:${NATSUI_DEMO_PORT:-4321}:4321']
    environment:
      NATSUI_URL: nats://nats-1:4222
      NATSUI_PROFILE: Try a real cluster
      NATSUI_MONITOR_URLS: http://nats-1:8222,http://nats-2:8222,http://nats-3:8222
      NATSUI_ALLOW_WRITES: '1'
    volumes: [dashboard-data:/data]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      traffic: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, 'http://127.0.0.1:4321/readyz']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    logging: *logging
configs:
  nats-config:
    content: |
      port: 4222
      http_port: 8222
      jetstream {
        store_dir: /data
        max_memory_store: 64MB
        max_file_store: 256MB
      }
      cluster {
        name: natsui-demo
        listen: 0.0.0.0:6222
        routes: [nats-route://nats-1:6222, nats-route://nats-2:6222, nats-route://nats-3:6222]
      }
volumes:
  node1:
  node2:
  node3:
  dashboard-data:
